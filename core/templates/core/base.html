<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Predicción IA</title>
    <!-- CSS de Bootstrap 5 para dar formato rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">🤖 Sistema de Préstamos IA</a>
        
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="navbar-text me-2">Hola, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'crear_consulta' %}" class="btn btn-success btn-sm">+ Nueva Solicitud</a>
                <form action="{% url 'logout' %}" method="POST" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a href="{% url 'registro' %}" class="btn btn-primary btn-sm">Registrarse</a>
            {% endif %}
        </div>
    </div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
